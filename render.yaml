services:
  - type: web
    name: iwantit-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    region: virginia
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 3333
      - key: WEB_ORIGIN
        value: https://iwantit-web.vercel.app
      - key: PASSWORD_RESET_URL
        value: https://iwantit-web.vercel.app/redefinir-senha
      - key: GOOGLE_OAUTH_SUCCESS_URL
        value: https://iwantit-web.vercel.app/app
      - key: GOOGLE_OAUTH_ERROR_URL
        value: https://iwantit-web.vercel.app/entrar
      - key: MONITORING_ENABLED
        value: "true"
      - key: MONITORING_INTERVAL_MINUTES
        value: "30"
      - key: MONITORING_BATCH_SIZE
        value: "50"
      - key: MERCADO_LIVRE_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true

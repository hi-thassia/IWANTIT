name: iwantit

x-node-service: &node-service
  image: node:22-alpine
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules

services:
  dependencies:
    <<: *node-service
    command: npm ci
    restart: "no"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iwantit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    <<: *node-service
    command: npm run db:migrate -w @iwantit/api
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iwantit}
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    <<: *node-service
    command: npm run dev -w @iwantit/api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-iwantit}
      MERCADO_LIVRE_ACCESS_TOKEN: ${MERCADO_LIVRE_ACCESS_TOKEN:-}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      MONITORING_INTERVAL_MINUTES: ${MONITORING_INTERVAL_MINUTES:-30}
      MONITORING_BATCH_SIZE: ${MONITORING_BATCH_SIZE:-50}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/redefinir-senha}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3333/api/auth/google/callback}
      GOOGLE_OAUTH_SUCCESS_URL: ${GOOGLE_OAUTH_SUCCESS_URL:-http://localhost:5173/app}
      GOOGLE_OAUTH_ERROR_URL: ${GOOGLE_OAUTH_ERROR_URL:-http://localhost:5173/entrar}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-I Want It <no-reply@example.com>}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    <<: *node-service
    command: npm run dev -w @iwantit/web -- --host 0.0.0.0
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  node_modules:
  postgres_data:
